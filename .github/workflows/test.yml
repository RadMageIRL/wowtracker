name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Environment
        run: |
          node --version
          echo "TZ=${TZ:-unset} LANG=${LANG:-unset} CPUs=$(nproc)"
      - name: Unit tests, data rules and house checks
        run: node tests/run.mjs
      - name: Schedule data is current and every rule passes
        run: node tools/build-data.mjs --check

  smoke:
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Browser and fonts on this runner
        run: |
          google-chrome --version
          echo "sans-serif: $(fc-match sans-serif)"
          echo "serif: $(fc-match serif)"
          echo "monospace: $(fc-match monospace)"
          fc-list : family | sort -u
          echo "CPUs=$(nproc)"
      - name: Reproducible build
        run: node tools/build.mjs --verify
      - name: Browser tests
        run: node tests/smoke.mjs
        env:
          CI: 'true'
      - name: The browser tests still catch the v0.3.0 news header defect
        run: node tests/controls.mjs
        env:
          CI: 'true'

  fonts:
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Android-like fonts (Roboto, Noto Serif)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends fonts-roboto-unhinted fonts-noto-core
          google-chrome --version
      - name: Build
        run: node tools/build.mjs
      - name: Layout checks with Android-like fonts
        run: node tests/smoke.mjs --layout --font-profile android
        env:
          CI: 'true'
      - name: Layout checks with Arial widths in the page
        run: node tests/smoke.mjs --layout --fonts arial-georgia
        env:
          CI: 'true'
      - name: The layout checks still catch the v0.3.0 news header defect with Android-like fonts
        run: node tests/controls.mjs --font-profile android
        env:
          CI: 'true'
